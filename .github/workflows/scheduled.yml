name: Scheduled Sports Booking

on:
  # Booking opens at 5:00 AM IST. GitHub Actions has ~30-60min jitter, so we start
  # the cron window at 3:30 AM IST. The bot pre-logins early and waits in-browser
  # until exactly 5:00 AM, then clicks the moment the booking window opens.
  # 3:30 AM IST = 22:00 UTC | 7:20 AM IST = 01:50 UTC
  schedule:
    - cron: "0,15,30,45 22 * * *"    # 03:30 AM – 04:15 AM IST  (early wake window)
    - cron: "0,15,30,45 23 * * *"    # 04:30 AM – 05:15 AM IST  (target window)
    - cron: "5,20,35,50 0-1 * * *"   # 05:35 AM – 07:20 AM IST  (retry window)

  # Allows manual trigger from the Actions tab for testing.
  workflow_dispatch:
    inputs:
      run_target_ist_hhmm:
        description: "Optional IST time override in HH:MM (example: 05:00)."
        required: false
        default: ""
      run_only_task_id:
        description: "Optional Task ID to run only one task."
        required: false
        default: ""
      ignore_trigger_time:
        description: "If true, do not match triggerTime and run filtered task(s) now."
        required: false
        type: boolean
        default: false

jobs:
  run-booking-bot:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    # Prevent overlapping runs if one execution is still in progress.
    concurrency:
      group: scheduled-sports-booking
      cancel-in-progress: false

    steps:
      # Step 1: Fetch repository code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime for backend scripts.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Step 3: Install backend dependencies from package-lock.json.
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Step 4: Install Chromium and required system libraries for Playwright.
      - name: Install Playwright browser
        working-directory: backend
        run: npx playwright install --with-deps chromium

      # Step 5: Generate Prisma client from schema.
      - name: Generate Prisma client
        working-directory: backend
        run: npm run prisma:generate:postgres

      # Step 5.5: Wake up Neon Serverless DB to prevent connection timeouts.
      - name: Wake up Database
        working-directory: backend
        run: node src/scripts/wake-db.js

      # Step 6: Apply committed migrations in non-interactive CI mode.
      - name: Run database migrations
        working-directory: backend
        run: npm run prisma:deploy:postgres

      # Step 7: Execute scheduled task runner script.
      # The script exits automatically after processing due tasks.
      - name: Run due tasks
        working-directory: backend
        env:
          # Optional: manual-run controls from workflow_dispatch inputs.
          RUN_TARGET_IST_HHMM: ${{ github.event.inputs.run_target_ist_hhmm }}
          RUN_ONLY_TASK_ID: ${{ github.event.inputs.run_only_task_id }}
          RUN_IGNORE_TRIGGER_TIME: ${{ github.event.inputs.ignore_trigger_time }}
        run: npm run run:due-tasks

      # Optional Step 8: Upload screenshots/log artifacts from this run.
      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/screenshots
          if-no-files-found: ignore
